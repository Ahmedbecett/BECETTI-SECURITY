name: Store package

# Builds and validates the Microsoft Store submission artifact:
#   - the Store manifest (version must end in .0, identity must match the
#     shipped manifest, only runFullTrust + internetClient allowed)
#   - an UNSIGNED .msixupload (StoreUpload mode, AppxPackageSigningEnabled=false)
#   - the artifact's structure, identity, architecture and payload
#   - the Windows App Certification Kit (WACK / appcert.exe) report
#
# Deliberately a separate workflow from ci.yml: ci.yml's packaging job
# produces the self-signed sideload test package for GitHub Releases and is
# not a Store artifact. Nothing in this workflow touches
# BecettiTestCert.pfx/.cer.
#
# Output: the "store-package-x64" workflow artifact (the .msixupload, the
# inner .msix, the WACK XML report and the verification text report), all
# downloadable from the Actions run summary.

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "packaging/store/**"
      - "scripts/prepare-store-package.ps1"
      - "scripts/package-store-upload.ps1"
      - "scripts/verify-store-package.ps1"
      - ".github/workflows/store-package.yml"
      - "src/Becetti.Security.App/Package.appxmanifest"
      - "store/**"
      # The artifact is built from the real sources, so a change anywhere in
      # the compiled projects invalidates the previous submission package.
      - "src/**"
      - "tests/**"

permissions:
  contents: write

jobs:
  build-store-package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify the Store manifest (identity / version / capabilities / assets)
        shell: pwsh
        run: ./scripts/prepare-store-package.ps1

      - name: Confirm the Store manifest matches Partner Center values in the repo
        shell: pwsh
        run: |
          # This does not talk to Partner Center (there is no API credential in
          # CI by design). It pins the identity so an accidental edit is caught
          # before a submission is built. A real change must be confirmed in
          # Partner Center -> Product identity first, then updated here.
          [xml]$m = Get-Content "packaging\store\Package.store.appxmanifest"
          $id = $m.Package.Identity
          if ($id.Name -ne "BECETTI.BECETTISECURITY") {
            Write-Host "::error::Identity Name is '$($id.Name)' - expected BECETTI.BECETTISECURITY (Partner Center value)."
            exit 1
          }
          if ($id.Publisher -ne "CN=A5D5DC31-4A15-4059-8030-D96C51054596") {
            Write-Host "::error::Publisher is '$($id.Publisher)' - expected the Partner Center publisher ID. Confirm in Partner Center before changing it."
            exit 1
          }
          if ($id.Version -ne "1.0.0.0") {
            Write-Host "::error::Store version is '$($id.Version)' - must be 1.0.0.0 (fourth component reserved by the Store)."
            exit 1
          }
          Write-Host "Store identity matches the pinned Partner Center values."

      - name: Build the unsigned .msixupload and run WACK
        shell: pwsh
        run: ./scripts/package-store-upload.ps1 -Version 1.0.0.0

      - name: Write a submission summary to the run page
        if: always()
        shell: pwsh
        run: |
          # $GITHUB_STEP_SUMMARY is the only thing that renders on the run page;
          # writing a local .md file would leave the reviewer with nothing to read.
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          $report = "artifacts\store\store-package-verification.txt"
          Add-Content -Path $summaryFile -Value "## Microsoft Store submission artifact"
          Add-Content -Path $summaryFile -Value ""
          if (Test-Path $report) {
            Add-Content -Path $summaryFile -Value '```'
            Get-Content $report | ForEach-Object { Add-Content -Path $summaryFile -Value $_ }
            Add-Content -Path $summaryFile -Value '```'
          } else {
            Add-Content -Path $summaryFile -Value "Verification report was not produced - the manifest check or the build failed before it ran."
          }
          if (Test-Path "artifacts\store\WACK-REPORT.xml") {
            Add-Content -Path $summaryFile -Value ""
            Add-Content -Path $summaryFile -Value "WACK XML report is attached as the ``store-package-x64`` artifact."
          }
          Get-Content $report -ErrorAction SilentlyContinue | Write-Host

          # The verification report only exists once the verifier ran. If the
          # build itself failed, the tail of the packaging transcript is the
          # only diagnostic available, so promote it to annotations.
          $pkgLog = "artifacts\store\package-store-upload.log"
          if (-not (Test-Path $report) -and (Test-Path $pkgLog)) {
            $tail = Get-Content $pkgLog -Tail 60
            Add-Content -Path $summaryFile -Value ""
            Add-Content -Path $summaryFile -Value "### Packaging log (last 60 lines)"
            Add-Content -Path $summaryFile -Value '```'
            foreach ($l in $tail) { Add-Content -Path $summaryFile -Value $l }
            Add-Content -Path $summaryFile -Value '```'
            $errs = Select-String -Path $pkgLog -Pattern 'error\s+[A-Z]+\d+|error ' -CaseSensitive:$false |
                Select-Object -Last 15
            foreach ($e in $errs) { Write-Host "::error::$($e.Line.Trim())" }
          }

      # Annotations are the only machine-readable channel that comes back out of
      # a run here: the artifact and the step summary are both blob storage,
      # which is not reachable from every client. Chunk the report into notice
      # annotations so the SHA-256 and the WACK verdict are readable from
      # `gh api .../check-runs/<id>/annotations`.
      - name: Publish the verification report as annotations
        if: always()
        shell: pwsh
        run: |
          $report = "artifacts\store\store-package-verification.txt"
          if (-not (Test-Path $report)) { Write-Host "No verification report to publish."; exit 0 }
          $text = (Get-Content $report -Raw) -replace "`r", ""
          $chunks = @()
          $buf = ""
          foreach ($line in ($text -split "`n")) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            if (($buf.Length + $line.Length) -gt 1200) { $chunks += $buf; $buf = "" }
            $buf += $line + " | "
          }
          if ($buf.Trim()) { $chunks += $buf }
          $i = 0
          foreach ($c in $chunks) {
            $i++
            $safe = $c -replace "%", "%25" -replace "`n", "%0A" -replace "`r", "%0D"
            Write-Host "::notice title=Store verification ($i/$($chunks.Count))::$safe"
            if ($i -ge 12) { break }
          }

      - name: Upload the Store submission artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-package-x64
          path: |
            artifacts/store/*.msixupload
            artifacts/store/*.msix
            artifacts/store/*.txt
            artifacts/store/*.xml
            artifacts/store/*.log
          if-no-files-found: warn
          retention-days: 30

      # A public, login-free download link. Workflow artifacts require a GitHub
      # session and expire after the retention window, which is useless for a
      # submission record that has to outlive the run.
      #
      # ONLY the .msixupload is published - never the inner .msix. The in-app
      # updater picks the highest-versioned asset whose name ends in ".msix"
      # (AppUpdaterService.ParseLatestReleaseJson); an unsigned Store .msix
      # could never be installed by a user, so publishing it would let a future
      # Store version (e.g. 1.1.0.0) silently outrank the signed sideload build
      # and hand people a package they cannot install.
      # Deliberately manual-only. An earlier revision published on every push,
      # so a one-line source change silently replaced the .msixupload that had
      # already been uploaded to Partner Center - new bytes, new SHA-256, same
      # version number. That is indistinguishable from tampering during
      # certification and makes every recorded hash stale. Building and
      # verifying still happens on every push; only *publishing* the public
      # submission artifact is an explicit act (Actions -> Run workflow).
      - name: Publish the submission package to a public release
        if: success() && github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "1.0.0.0"
          $upload = "artifacts\store\BECETTI-SECURITY_${version}_x64.msixupload"
          if (-not (Test-Path $upload)) { Write-Host "::error::No .msixupload to publish."; exit 1 }

          $tag = "store-package-$version"
          $notes = @"
          Microsoft Store submission package for BECETTI SECURITY $version (x64).

          UNSIGNED on purpose - Microsoft re-signs it after certification.
          Upload this .msixupload in Partner Center -> Packages; it is not
          installable by end users.

          SHA-256: $((Get-FileHash $upload -Algorithm SHA256).Hash)
          Built by Store package run ${{ github.run_id }} from ${{ github.sha }}.
          "@

          # Re-running the workflow must replace the assets, not fail on "already exists".
          gh release view $tag --repo ${{ github.repository }} 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo ${{ github.repository }} --yes --cleanup-tag 2>$null
          }
          gh release create $tag `
            --repo ${{ github.repository }} `
            --target ${{ github.sha }} `
            --title "BECETTI SECURITY $version - Microsoft Store submission package" `
            --notes $notes `
            --prerelease `
            $upload `
            "artifacts\store\store-package-verification.txt" `
            "artifacts\store\WACK-REPORT.xml"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Failed to publish the release."; exit 1 }
          Write-Host "Published: https://github.com/${{ github.repository }}/releases/tag/$tag"
