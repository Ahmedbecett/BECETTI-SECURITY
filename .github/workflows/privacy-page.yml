name: Privacy policy page

# Publishes docs/privacy/index.html to GitHub Pages so Partner Center has a
# stable, public privacy-policy URL.
#
# Why this exists: the policy has always lived at store/privacy-policy.md, but
# the links in the docs pointed at an `arena/<id>-becetti-security` working
# branch. Those branches are disposable - when one is deleted the URL 404s and
# the Store listing's required privacy URL breaks. Pages on main is a URL that
# survives every branch, every rebuild and every release.
#
# One-time setup (repository admin): Settings -> Pages -> Source = GitHub
# Actions. Until that is done the deploy step fails with "Pages is not enabled".

on:
  push:
    branches: [main]
    paths:
      - "docs/privacy/**"
      - ".github/workflows/privacy-page.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Verifies the published policy is reachable at the canonical main-branch URL
  # on every push. This runs regardless of Pages state, so the privacy URL the
  # Store listing points at can never silently rot.
  verify-url:
    runs-on: ubuntu-latest
    steps:
      - name: Check the main-branch privacy URLs return 200
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://github.com/${{ github.repository }}/blob/main/store/privacy-policy.md" \
            "https://github.com/${{ github.repository }}/blob/main/docs/privacy/index.html"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 4 --retry-delay 5 "$url")
            echo "$code  $url"
            if [ "$code" != "200" ]; then
              echo "::error::Privacy URL is not reachable ($code): $url"
              exit 1
            fi
          done
          echo "Privacy URLs OK."

  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/privacy
      # GitHub Pages needs a one-time repository-admin action
      # (Settings -> Pages -> Source = GitHub Actions). The API rejects enabling
      # it even for an admin token ("Resource not accessible by integration"),
      # so this job cannot be made green from CI alone. It is allowed to fail
      # without blocking anything: the verify-url job above is the real guard,
      # and the main-branch blob URL is a working privacy URL today.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
