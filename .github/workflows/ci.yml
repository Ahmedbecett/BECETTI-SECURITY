name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Becetti.Security.sln

      - name: Build (Release, x64)
        run: dotnet build Becetti.Security.sln -c Release --no-restore -p:Platform=x64

      - name: Test
        run: dotnet test Becetti.Security.sln -c Release --no-build -p:Platform=x64

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore
