name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Becetti.Security.sln

      - name: Build (Release, x64)
        shell: pwsh
        run: |
          dotnet build Becetti.Security.sln -c Release --no-restore -p:Platform=x64 2>&1 |
            Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::group::Build failed - error/warning lines from build.log"
            $hits = Select-String -Path build.log -Pattern 'error |warning ' -CaseSensitive:$false
            $shown = 0
            foreach ($hit in $hits) {
              if ($shown -ge 40) { break }
              Write-Host "::error::$($hit.Line.Trim())"
              $shown++
            }
            Write-Host "::endgroup::"
            exit $code
          }

      - name: Test
        run: dotnet test Becetti.Security.sln -c Release --no-build -p:Platform=x64

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore
