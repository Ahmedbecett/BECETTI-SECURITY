name: CI

on:
  push:
    branches: [main, "arena/**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Becetti.Security.sln

      - name: Build (Release, x64)
        shell: pwsh
        run: |
          dotnet build Becetti.Security.sln -c Release --no-restore -p:Platform=x64 2>&1 |
            Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::group::Build failed - error/warning lines from build.log"
            $hits = Select-String -Path build.log -Pattern 'error |warning |Xaml|APPX|WMC' -CaseSensitive:$false
            $shown = 0
            foreach ($hit in $hits) {
              if ($shown -ge 40) { break }
              Write-Host "::error::$($hit.Line.Trim())"
              $shown++
            }
            Write-Host "::endgroup::"

            Write-Host "::group::Re-running Becetti.Security.App alone with detailed verbosity for diagnosis"
            dotnet build src/Becetti.Security.App/Becetti.Security.App.csproj -c Release --no-restore -p:Platform=x64 -v:detailed 2>&1 |
              Tee-Object -FilePath app-detailed.log | Out-Null
            $lines = Get-Content app-detailed.log
            $contextIdx = @()
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match 'XamlCompiler|error |Exception|Unhandled') {
                $contextIdx += $i
              }
            }
            $shown2 = 0
            $printed = New-Object 'System.Collections.Generic.HashSet[int]'
            foreach ($idx in $contextIdx) {
              if ($shown2 -ge 60) { break }
              $start = [Math]::Max(0, $idx - 2)
              $end = [Math]::Min($lines.Count - 1, $idx + 2)
              for ($j = $start; $j -le $end; $j++) {
                if ($printed.Contains($j)) { continue }
                [void]$printed.Add($j)
                if ([string]::IsNullOrWhiteSpace($lines[$j])) { continue }
                Write-Host "::warning::$($lines[$j].Trim())"
                $shown2++
                if ($shown2 -ge 60) { break }
              }
            }
            Write-Host "::endgroup::"
            exit $code
          }

      - name: Test
        shell: pwsh
        run: |
          dotnet test Becetti.Security.sln -c Release --no-build -p:Platform=x64 --logger "console;verbosity=detailed" 2>&1 |
            Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::group::Test failed - failing test lines from test.log"
            $hits = Select-String -Path test.log -Pattern '\[FAIL\]|^\s*Failed |Error Message|Assert\.|Expected:|Actual:|Stack Trace|at Becetti' -CaseSensitive:$false |
              Where-Object { $_.Line -notmatch '^\s*Passed ' }
            $shown = 0
            foreach ($hit in $hits) {
              if ($shown -ge 50) { break }
              Write-Host "::error::$($hit.Line.Trim())"
              $shown++
            }
            Write-Host "::endgroup::"
            exit $code
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore

  postgres-migrations:
    # Windows runners cannot host service containers, so this job verifies
    # real PostgreSQL connectivity + EF Core migrations on Linux instead.
    # It only builds/runs the Api project (no WinUI 3 / Windows App SDK
    # involved), against a genuine PostgreSQL server, not SQLite or a mock.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: becetti
          POSTGRES_PASSWORD: becetti_ci_password
          POSTGRES_DB: becetti_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=becetti_security;Username=becetti;Password=becetti_ci_password"
      Jwt__SigningKey: "ci-postgres-job-signing-key-at-least-32-characters-long"
      Jwt__Issuer: "becetti-security-api"
      Jwt__Audience: "becetti-security-app"
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore Api project
        run: dotnet restore src/Becetti.Security.Api/Becetti.Security.Api.csproj

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 8.*

      - name: Apply EF Core migrations to real PostgreSQL
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update \
            --project src/Becetti.Security.Api/Becetti.Security.Api.csproj \
            --connection "$ConnectionStrings__Postgres"

      - name: Verify the migrated schema has the expected tables
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          PGPASSWORD=becetti_ci_password psql -h localhost -U becetti -d becetti_security -c "\dt" | tee tables.log
          for t in "Users" "RefreshTokens" "ReputationEntries" "ReleaseVersions" "AuditLogs"; do
            grep -qi "$t" tables.log || { echo "::error::Expected table $t was not created by the migration"; exit 1; }
          done
          echo "All expected tables exist in the real PostgreSQL database."

  package-msix:
    # Builds a real, installable MSIX of the WinUI 3 app and signs it with a
    # freshly generated self-signed test certificate (there is no Partner
    # Center / Store signing identity available in this environment - see
    # docs/STORE-SUBMISSION.md). The signed package + its public certificate
    # are published as a GitHub Release so they have a stable download URL.
    # This is a TEST package for sideloading, not a Store-ready submission.
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore (msbuild, not dotnet - required for single-project MSIX packaging targets)
        run: msbuild src\Becetti.Security.App\Becetti.Security.App.csproj /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Generate self-signed test signing certificate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging\output | Out-Null

          # A plain New-SelfSignedCertificate + Export-PfxCertificate pair is
          # rejected by the MSIX packaging tools with APPX0107 ("not valid for
          # signing"): it needs an explicit Basic Constraints extension plus
          # the Code Signing EKU, and exporting via the X509Certificate2.Export
          # API (rather than Export-PfxCertificate) avoids a separate
          # "key file may be password protected" (APPX0105) failure some
          # CSPs hit on Windows Server runner images.
          $basicConstraints = [System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new($false, $false, 0, $true)
          $ekuOids = [System.Security.Cryptography.OidCollection]::new()
          [void]$ekuOids.Add([System.Security.Cryptography.Oid]::new("1.3.6.1.5.5.7.3.3", "Code Signing"))
          $eku = [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($ekuOids, $true)

          $cert = New-SelfSignedCertificate `
            -Subject "CN=BECETTI" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeySpec Signature `
            -KeyUsage DigitalSignature `
            -KeyLength 2048 `
            -KeyAlgorithm RSA `
            -HashAlgorithm SHA256 `
            -Extension @($basicConstraints, $eku) `
            -FriendlyName "BECETTI SECURITY test signing certificate" `
            -NotAfter ([System.DateTime]::UtcNow.Date.AddYears(1))

          $pw = [System.Guid]::NewGuid().ToString("N")
          $pfxBytes = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx, $pw)
          [System.IO.File]::WriteAllBytes("packaging\output\BecettiTestCert.pfx", $pfxBytes)
          $cerBytes = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          [System.IO.File]::WriteAllBytes("packaging\output\BecettiTestCert.cer", $cerBytes)
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force

          "PFX_PASSWORD=$pw" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and package the signed MSIX (official single-project MSIX CI recipe)
        shell: pwsh
        run: |
          # This follows Microsoft's documented single-project MSIX CI recipe
          # (learn.microsoft.com/windows/apps/package-and-deploy/ci-for-winui3):
          # real msbuild.exe (not `dotnet publish`), UapAppxPackageBuildMode=
          # SideloadOnly, AppxBundle=Never, GenerateAppxPackageOnBuild=true,
          # and an explicit AppxPackageDir so the output location is known.
          $certPath = Join-Path $PWD "packaging\output\BecettiTestCert.pfx"
          $outDir = Join-Path $PWD "packaging\output\AppPackages\"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          msbuild src\Becetti.Security.App\Becetti.Security.App.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile=$certPath `
            /p:PackageCertificatePassword=$env:PFX_PASSWORD `
            /p:AppxPackageDir=$outDir `
            /p:GenerateAppxPackageOnBuild=true `
            2>&1 | Tee-Object -FilePath msix-publish.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::group::MSIX build failed - full log"
            Get-Content msix-publish.log | Select-Object -Last 200 | ForEach-Object { Write-Host "::error::$_" }
            Write-Host "::endgroup::"
            exit $LASTEXITCODE
          }

      - name: Collect the signed MSIX next to its certificate
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path . -Recurse -Filter *.msix -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msix) {
            Write-Host "::group::No .msix found anywhere in the repo tree - diagnostics"
            Write-Host "--- Tail of msix-publish.log ---"
            Get-Content msix-publish.log -ErrorAction SilentlyContinue | Select-Object -Last 150
            Write-Host "--- Contents of packaging\output ---"
            Get-ChildItem -Path packaging\output -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            Write-Host "::endgroup::"
            Write-Host "::error::No .msix file was produced by msbuild - see diagnostics above"
            exit 1
          }
          Copy-Item $msix.FullName "packaging\output\BECETTI-SECURITY_1.0.0.0_x64.msix"
          Write-Host "MSIX produced: packaging\output\BECETTI-SECURITY_1.0.0.0_x64.msix (source: $($msix.FullName))"
          Get-Item "packaging\output\BECETTI-SECURITY_1.0.0.0_x64.msix" | Format-List Name, Length, FullName

      - name: Verify the MSIX is actually signed (not just packaged)
        shell: pwsh
        run: |
          # An MSIX is a zip container; a genuinely signed package always
          # contains an AppxSignature.p7x member. The build step emitted some
          # non-fatal APPX0107/APPX0105-looking warnings from an unrelated
          # intermediate pass, so verify the real output directly instead of
          # trusting exit codes alone.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $path = (Resolve-Path "packaging\output\BECETTI-SECURITY_1.0.0.0_x64.msix").Path
          $zip = [System.IO.Compression.ZipFile]::OpenRead($path)
          try {
            $sig = $zip.Entries | Where-Object { $_.FullName -eq "AppxSignature.p7x" }
            $manifest = $zip.Entries | Where-Object { $_.FullName -eq "AppxManifest.xml" }
            if (-not $sig) {
              Write-Host "::error::AppxSignature.p7x is missing from the .msix - the package was NOT actually signed."
              exit 1
            }
            if (-not $manifest) {
              Write-Host "::error::AppxManifest.xml is missing from the .msix - this is not a valid package."
              exit 1
            }
            Write-Host "AppxSignature.p7x present ($($sig.Length) bytes) - the package is genuinely signed."
            Write-Host "AppxManifest.xml present ($($manifest.Length) bytes) - the package is structurally valid."
          } finally {
            $zip.Dispose()
          }

      - name: Try to verify the signature chain (expected to show it is self-signed/untrusted)
        shell: pwsh
        continue-on-error: true
        run: |
          $sdkBin = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1
          $signtool = Join-Path $sdkBin.FullName "x64\signtool.exe"
          if (Test-Path $signtool) {
            & $signtool verify /pa /v "packaging\output\BECETTI-SECURITY_1.0.0.0_x64.msix"
          } else {
            Write-Host "signtool.exe not found at expected SDK path - skipping chain verification (non-fatal)."
          }

      - name: Upload publish log (diagnostics)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msix-publish-log
          path: msix-publish.log
          if-no-files-found: ignore

      - name: Write install instructions
        shell: pwsh
        run: |
          @"
          BECETTI SECURITY - TEST MSIX build (commit ${{ github.sha }})

          This package is signed with a self-signed TEST certificate generated
          during this CI run. It is NOT signed by a trusted Certificate
          Authority or by a Microsoft Partner Center publisher identity, so
          Windows will refuse to install it until you trust the certificate
          first. This is expected for a sideloaded test build.

          To install on Windows 10/11:
            1. Download both BECETTI-SECURITY_1.0.0.0_x64.msix and
               BecettiTestCert.cer from this release.
            2. Right-click BecettiTestCert.cer -> Install Certificate ->
               Local Machine -> "Place all certificates in the following
               store" -> Trusted People (or Trusted Root Certification
               Authorities) -> Finish. (Requires administrator rights.)
            3. Double-click BECETTI-SECURITY_1.0.0.0_x64.msix -> Install.

          Alternative (PowerShell, as Administrator):
            Import-Certificate -FilePath BecettiTestCert.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople
            Add-AppxPackage -Path BECETTI-SECURITY_1.0.0.0_x64.msix

          This is a sideloading test package, not the Microsoft Store
          submission artifact - see docs/STORE-SUBMISSION.md for that
          process, which requires a real Partner Center publisher identity
          and certificate.
          "@ | Out-File -FilePath packaging\output\INSTALL.txt -Encoding utf8

      - name: Publish signed MSIX + certificate to a GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="msix-test-${GITHUB_SHA::7}"
          gh release create "$tag" \
            packaging/output/BECETTI-SECURITY_1.0.0.0_x64.msix \
            packaging/output/BecettiTestCert.cer \
            packaging/output/INSTALL.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "BECETTI SECURITY - signed test MSIX ($tag)" \
            --notes "Self-signed TEST sideload package built from commit ${GITHUB_SHA}. See INSTALL.txt in the release assets for how to trust the certificate before installing. Not a Microsoft Store submission artifact." \
            --latest=false
          echo "Release created: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
